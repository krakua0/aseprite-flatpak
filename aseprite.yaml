app-id: org.krakua0.Aseprite
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: aseprite
finish-args:
  - --socket=x11
  #- --socket=wayland
  #- --socket=fallback-x11
  # Aseprite has no Wayland support as of 2025:
  # https://github.com/aseprite/aseprite/issues/3448
  - --share=network # update check + crash reporter
  - --share=ipc
  - --device=dri
  - --filesystem=home # covers all xdg-* subsets; see sandbox audit
cleanup:
  - /include
  - /lib/pkgconfig
  - /bin/mdb*
  - "*.a"
  - /libexec
  - /lib/cmake
  - /share/gdb
  - /share/man
  - /lib/debug
  - /lib/girepository-1.0/
modules:
  - name: aseprite
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      prepend-path: /usr/lib/sdk/llvm20/bin
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++
      - -DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++
      - -DLAF_BACKEND=skia
      - -DSKIA_DIR=/run/build/aseprite/skia
      - -DSKIA_LIBRARY_DIR=/run/build/aseprite/skia/out/Release-x64
      - -DSKIA_LIBRARY=/run/build/aseprite/skia/out/Release-x64/libskia.a
    sources:
      - type: git
        url: https://github.com/aseprite/aseprite
        tag: v1.3.18.6
        commit: 331e898ef405d919539c03fd1675691cfa16c3a3
      - type: archive
        url: https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
        sha256: a327e89b244f24cecaa34eb37544bae00d447b96c583d26ed29d6a3ad2e8a8b8
        dest: skia
        strip-components: 0
        # flatpak-builder unpacks archives with the top dir intact:
        # https://github.com/flatpak/flatpak-builder/issues/35
      - type: file
        path: aseprite.metainfo.xml
      - type: file
        path: aseprite.desktop
      - type: file
        path: aseprite.mime.xml
    # post-install / build-commands run in _flatpak_build (builddir: true).
    # Env there: FLATPAK_ID (app-id), FLATPAK_DEST (=/app), FLATPAK_ARCH.
    # Sandbox layout at that point:
    #   /run/build/aseprite/ = FLATPAK_BUILDER_BUILDDIR
    #   +-- data/icons/ase256.png        from the aseprite git source
    #   +-- skia/                        from the archive source (dest: skia)
    #   +-- aseprite.desktop / .metainfo.xml / .mime.xml  (type: file)
    #   +-- _flatpak_build/              cmake-ninja build dir (cwd)
    post-install:
      # one shell script: each install is wrapped with \ to keep lines readable
      - |
        install -vDm644 ${FLATPAK_BUILDER_BUILDDIR}/data/icons/ase256.png \
          ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
        install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/aseprite.desktop \
          ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
        install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/aseprite.metainfo.xml \
          ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
        install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/aseprite.mime.xml \
          ${FLATPAK_DEST}/share/mime/packages/${FLATPAK_ID}.xml
